name: ZIP 압축 해제 및 APK 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'NaturalSeupjjo_Complete_Project*.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: ZIP 압축 풀기
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name 'NaturalSeupjjo_Complete_Project*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP 파일을 찾을 수 없습니다."
            exit 1
          fi

          mkdir extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: 프로젝트 확인
        run: |
          PROJECT_DIR=$(find extracted -type f \
            -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle 프로젝트를 찾을 수 없습니다."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Java 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK 저장
        uses: actions/upload-artifact@v4
        with:
          name: NaturalSeupjjo-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
